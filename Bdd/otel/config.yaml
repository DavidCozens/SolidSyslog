# OpenTelemetry Collector Contrib config — Windows BDD oracle.
# Receives RFC 5424 syslog over UDP, TCP, TLS (6514), and mTLS (6515) on
# 127.0.0.1 and writes each parsed log record as a JSON line to one combined
# file (Bdd/output/received.jsonl) and one per-transport file
# (Bdd/output/received_{udp,tcp,tls,mtls}.jsonl). Mirrors the Linux syslog-ng
# setup so cross-platform BDD steps that read either the combined or
# per-transport file work the same on both runners.
#
# Used by the bdd-windows runner as a Windows-native replacement for
# syslog-ng (no WSL/Wine/Docker needed).
#
# UDP and TCP share port 5514 — they're separate sockets, so the kernel keeps
# them apart. TLS and mTLS land on dedicated ports.

receivers:
  # Each syslog receiver instance accepts exactly one of udp: or tcp:, so we
  # spin named instances per transport and feed them through the right pipeline.
  syslog/udp:
    udp:
      listen_address: "127.0.0.1:5514"
    protocol: rfc5424
  syslog/tcp:
    tcp:
      listen_address: "127.0.0.1:5514"
    protocol: rfc5424
    # The library frames TCP messages with RFC 6587 §3.4.1 octet-counting
    # (`<len> <space> <message>`); without this flag the syslog receiver
    # passes the raw frame to the rfc5424 parser, which rejects the digits
    # before `<`. Mirrors what syslog-ng does by default on the Linux side.
    enable_octet_counting: true
  syslog/tls:
    tcp:
      listen_address: "127.0.0.1:6514"
      tls:
        cert_file: Bdd/syslog-ng/tls/server.pem
        key_file: Bdd/syslog-ng/tls/server.key
        # Pinned to 1.3 so delivery here proves the version, matching the
        # ssl-options on the Linux listener. Without it the TLS 1.3 scenario
        # passes on this runner whatever gets negotiated.
        min_version: "1.3"
    protocol: rfc5424
    enable_octet_counting: true
  syslog/mtls:
    tcp:
      listen_address: "127.0.0.1:6515"
      tls:
        cert_file: Bdd/syslog-ng/tls/server.pem
        key_file: Bdd/syslog-ng/tls/server.key
        client_ca_file: Bdd/syslog-ng/tls/ca.pem
        min_version: "1.3"
    protocol: rfc5424
    enable_octet_counting: true

  # Right name, issuer the target cannot chain to.
  syslog/tls_untrusted:
    tcp:
      listen_address: "127.0.0.1:6516"
      tls:
        cert_file: Bdd/syslog-ng/tls/server-untrusted.pem
        key_file: Bdd/syslog-ng/tls/server-untrusted.key
        min_version: "1.3"
    protocol: rfc5424
    enable_octet_counting: true
  # Chains to the anchor, claims another identity.
  syslog/tls_wrongname:
    tcp:
      listen_address: "127.0.0.1:6517"
      tls:
        cert_file: Bdd/syslog-ng/tls/server-wrongname.pem
        key_file: Bdd/syslog-ng/tls/server-wrongname.key
        min_version: "1.3"
    protocol: rfc5424
    enable_octet_counting: true
  # No chain at all; reachable only by a pinned target.
  syslog/tls_selfsigned:
    tcp:
      listen_address: "127.0.0.1:6518"
      tls:
        cert_file: Bdd/syslog-ng/tls/server-selfsigned.pem
        key_file: Bdd/syslog-ng/tls/server-selfsigned.key
        min_version: "1.3"
    protocol: rfc5424
    enable_octet_counting: true
  # Leaf presented with its issuer.
  syslog/tls_chained:
    tcp:
      listen_address: "127.0.0.1:6519"
      tls:
        cert_file: Bdd/syslog-ng/tls/server-chained-fullchain.pem
        key_file: Bdd/syslog-ng/tls/server-chained.key
        min_version: "1.3"
    protocol: rfc5424
    enable_octet_counting: true
  # The happy-path certificate over TLS 1.2 only.
  syslog/tls_12:
    tcp:
      listen_address: "127.0.0.1:6520"
      tls:
        cert_file: Bdd/syslog-ng/tls/server.pem
        key_file: Bdd/syslog-ng/tls/server.key
        min_version: "1.2"
        max_version: "1.2"
    protocol: rfc5424
    enable_octet_counting: true
  # A second collector with its own issuer and name, for the redirect.
  syslog/tls_b:
    tcp:
      listen_address: "127.0.0.1:6521"
      tls:
        cert_file: Bdd/syslog-ng/tls/server-b.pem
        key_file: Bdd/syslog-ng/tls/server-b.key
        min_version: "1.3"
    protocol: rfc5424
    enable_octet_counting: true

exporters:
  # Combined output — every received record lands here regardless of
  # transport. The cross-platform "the syslog oracle receives N message" step
  # reads from context.received_log which points here.
  file:
    path: "Bdd/output/received.jsonl"
    rotation:
      max_megabytes: 10
      max_backups: 1
  # Per-transport outputs — mirror the Linux syslog-ng received_<X>.log
  # files. The "the syslog oracle receives N message over <X>" step reads
  # from these to pin the transport actually used end-to-end.
  file/udp:
    path: "Bdd/output/received_udp.jsonl"
    rotation:
      max_megabytes: 10
      max_backups: 1
  file/tcp:
    path: "Bdd/output/received_tcp.jsonl"
    rotation:
      max_megabytes: 10
      max_backups: 1
  file/tls:
    path: "Bdd/output/received_tls.jsonl"
    rotation:
      max_megabytes: 10
      max_backups: 1
  file/mtls:
    path: "Bdd/output/received_mtls.jsonl"
    rotation:
      max_megabytes: 10
      max_backups: 1
  file/tls_b:
    path: "Bdd/output/received_tls_b.jsonl"
    rotation:
      max_megabytes: 10
      max_backups: 1

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    logs:
      receivers: [syslog/udp, syslog/tcp, syslog/tls, syslog/tls_untrusted, syslog/tls_wrongname, syslog/tls_selfsigned, syslog/tls_chained, syslog/tls_12, syslog/mtls, syslog/tls_b]
      exporters: [file]
    logs/udp:
      receivers: [syslog/udp]
      exporters: [file/udp]
    logs/tcp:
      receivers: [syslog/tcp]
      exporters: [file/tcp]
    logs/tls:
      receivers: [syslog/tls, syslog/tls_untrusted, syslog/tls_wrongname, syslog/tls_selfsigned, syslog/tls_chained, syslog/tls_12]
      exporters: [file/tls]
    logs/tls_b:
      receivers: [syslog/tls_b]
      exporters: [file/tls_b]
    logs/mtls:
      receivers: [syslog/mtls]
      exporters: [file/mtls]
