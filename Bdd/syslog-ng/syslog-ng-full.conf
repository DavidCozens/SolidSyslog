@version: 4.11

source s_udp {
    syslog(
        transport("udp")
        port(5514)
        keep-hostname(yes)
    );
};

source s_tcp {
    syslog(
        transport("tcp")
        port(5514)
        keep-hostname(yes)
    );
};

source s_tls {
    syslog(
        transport("tls")
        port(6514)
        keep-hostname(yes)
        tls(
            key-file("/etc/syslog-ng/tls/server.key")
            cert-file("/etc/syslog-ng/tls/server.pem")
            ca-file("/etc/syslog-ng/tls/ca.pem")
            peer-verify(optional-untrusted)
            ssl-options("no-sslv2", "no-sslv3", "no-tlsv1", "no-tlsv11", "no-tlsv12")
        )
    );
};

source s_mtls {
    syslog(
        transport("tls")
        port(6515)
        keep-hostname(yes)
        tls(
            key-file("/etc/syslog-ng/tls/server.key")
            cert-file("/etc/syslog-ng/tls/server.pem")
            ca-file("/etc/syslog-ng/tls/ca.pem")
            peer-verify(required-trusted)
            ssl-options("no-sslv2", "no-sslv3", "no-tlsv1", "no-tlsv11", "no-tlsv12")
        )
    );
};

# Right name, issuer the target cannot chain to. Refused as untrusted.
source s_tls_untrusted {
    syslog(
        transport("tls")
        port(6516)
        keep-hostname(yes)
        tls(
            key-file("/etc/syslog-ng/tls/server-untrusted.key")
            cert-file("/etc/syslog-ng/tls/server-untrusted.pem")
            ca-file("/etc/syslog-ng/tls/ca.pem")
            peer-verify(optional-untrusted)
            ssl-options("no-sslv2", "no-sslv3", "no-tlsv1", "no-tlsv11", "no-tlsv12")
        )
    );
};

# Chains to the anchor, claims another identity. Refused on the name.
source s_tls_wrongname {
    syslog(
        transport("tls")
        port(6517)
        keep-hostname(yes)
        tls(
            key-file("/etc/syslog-ng/tls/server-wrongname.key")
            cert-file("/etc/syslog-ng/tls/server-wrongname.pem")
            ca-file("/etc/syslog-ng/tls/ca.pem")
            peer-verify(optional-untrusted)
            ssl-options("no-sslv2", "no-sslv3", "no-tlsv1", "no-tlsv11", "no-tlsv12")
        )
    );
};

# No chain at all. Reachable only by a target that pins its fingerprint.
source s_tls_selfsigned {
    syslog(
        transport("tls")
        port(6518)
        keep-hostname(yes)
        tls(
            key-file("/etc/syslog-ng/tls/server-selfsigned.key")
            cert-file("/etc/syslog-ng/tls/server-selfsigned.pem")
            ca-file("/etc/syslog-ng/tls/ca.pem")
            peer-verify(optional-untrusted)
            ssl-options("no-sslv2", "no-sslv3", "no-tlsv1", "no-tlsv11", "no-tlsv12")
        )
    );
};

# Leaf presented with its issuer, so the chain is checked above depth zero.
source s_tls_chained {
    syslog(
        transport("tls")
        port(6519)
        keep-hostname(yes)
        tls(
            key-file("/etc/syslog-ng/tls/server-chained.key")
            cert-file("/etc/syslog-ng/tls/server-chained-fullchain.pem")
            ca-file("/etc/syslog-ng/tls/ca.pem")
            peer-verify(optional-untrusted)
            ssl-options("no-sslv2", "no-sslv3", "no-tlsv1", "no-tlsv11", "no-tlsv12")
        )
    );
};

# The happy-path certificate, offered over TLS 1.2 only.
source s_tls_12 {
    syslog(
        transport("tls")
        port(6520)
        keep-hostname(yes)
        tls(
            key-file("/etc/syslog-ng/tls/server.key")
            cert-file("/etc/syslog-ng/tls/server.pem")
            ca-file("/etc/syslog-ng/tls/ca.pem")
            peer-verify(optional-untrusted)
            ssl-options("no-sslv2", "no-sslv3", "no-tlsv1", "no-tlsv11", "no-tlsv13")
        )
    );
};

# A second collector with its own issuer and its own name, for the redirect.
source s_tls_b {
    syslog(
        transport("tls")
        port(6521)
        keep-hostname(yes)
        tls(
            key-file("/etc/syslog-ng/tls/server-b.key")
            cert-file("/etc/syslog-ng/tls/server-b.pem")
            ca-file("/etc/syslog-ng/tls/ca.pem")
            peer-verify(optional-untrusted)
            ssl-options("no-sslv2", "no-sslv3", "no-tlsv1", "no-tlsv11", "no-tlsv12")
        )
    );
};

destination d_file {
    file(
        "/var/log/syslog-ng/received.log"
        template("PRIORITY=${PRI} TIMESTAMP=${ISODATE} HOSTNAME=${HOST} APP_NAME=${PROGRAM} PROCID=${PID} MSGID=${MSGID} STRUCTURED_DATA=${SDATA} MSG=${MSG}\n")
        flush_lines(1)
        create-dirs(yes)
        perm(0644)
    );
};

destination d_file_udp {
    file(
        "/var/log/syslog-ng/received_udp.log"
        template("PRIORITY=${PRI} TIMESTAMP=${ISODATE} HOSTNAME=${HOST} APP_NAME=${PROGRAM} PROCID=${PID} MSGID=${MSGID} STRUCTURED_DATA=${SDATA} MSG=${MSG}\n")
        flush_lines(1)
        create-dirs(yes)
        perm(0644)
    );
};

destination d_file_tcp {
    file(
        "/var/log/syslog-ng/received_tcp.log"
        template("PRIORITY=${PRI} TIMESTAMP=${ISODATE} HOSTNAME=${HOST} APP_NAME=${PROGRAM} PROCID=${PID} MSGID=${MSGID} STRUCTURED_DATA=${SDATA} MSG=${MSG}\n")
        flush_lines(1)
        create-dirs(yes)
        perm(0644)
    );
};

destination d_file_tls {
    file(
        "/var/log/syslog-ng/received_tls.log"
        template("PRIORITY=${PRI} TIMESTAMP=${ISODATE} HOSTNAME=${HOST} APP_NAME=${PROGRAM} PROCID=${PID} MSGID=${MSGID} STRUCTURED_DATA=${SDATA} MSG=${MSG}\n")
        flush_lines(1)
        create-dirs(yes)
        perm(0644)
    );
};

destination d_file_mtls {
    file(
        "/var/log/syslog-ng/received_mtls.log"
        template("PRIORITY=${PRI} TIMESTAMP=${ISODATE} HOSTNAME=${HOST} APP_NAME=${PROGRAM} PROCID=${PID} MSGID=${MSGID} STRUCTURED_DATA=${SDATA} MSG=${MSG}\n")
        flush_lines(1)
        create-dirs(yes)
        perm(0644)
    );
};

destination d_file_tls_b {
    file(
        "/var/log/syslog-ng/received_tls_b.log"
        template("PRIORITY=${PRI} TIMESTAMP=${ISODATE} HOSTNAME=${HOST} APP_NAME=${PROGRAM} PROCID=${PID} MSGID=${MSGID} STRUCTURED_DATA=${SDATA} MSG=${MSG}\n")
        flush_lines(1)
        create-dirs(yes)
        perm(0644)
    );
};

log {
    source(s_udp);
    source(s_tcp);
    source(s_tls);
    source(s_mtls);
    source(s_tls_untrusted);
    source(s_tls_wrongname);
    source(s_tls_selfsigned);
    source(s_tls_chained);
    source(s_tls_12);
    source(s_tls_b);
    destination(d_file);
};

log {
    source(s_udp);
    destination(d_file_udp);
};

log {
    source(s_tcp);
    destination(d_file_tcp);
};

log {
    source(s_tls);
    source(s_tls_untrusted);
    source(s_tls_wrongname);
    source(s_tls_selfsigned);
    source(s_tls_chained);
    source(s_tls_12);
    destination(d_file_tls);
};

log {
    source(s_tls_b);
    destination(d_file_tls_b);
};

log {
    source(s_mtls);
    destination(d_file_mtls);
};
